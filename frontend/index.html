  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "Panjara Agro Farmers Producer Company Limited",
          "description": "Farmer Producer Company engaged in aggregation, processing, trading, exporting/importing of agricultural commodities.",
          "url": "https://panjara-agro.vercel.app",
          "logo": "https://panjara-agro.vercel.app/og-image.png",
          "foundingDate": "2020",
          "areaServed": "Worldwide",
          "email": "panjaraagro@gmail.com",
          "telephone": "+917758866318",
          "address": {
            "@type": "PostalAddress",
            "addressRegion": "Maharashtra",
            "addressCountry": "IN"
          },
          "knowsAbout": ["Agricultural Commodities", "Food Grains", "Spices", "Pulses", "Oilseeds", "Agro Export", "Farmer Producer Company"],
          "hasOfferCatalog": {
            "@type": "OfferCatalog",
            "name": "Agricultural Commodities Export Catalog",
            "itemListElement": [
              { "@type": "Offer", "itemOffered": { "@type": "Product", "name": "Food Grains", "description": "Rice, Wheat, Maize, Millets" } },
              { "@type": "Offer", "itemOffered": { "@type": "Product", "name": "Pulses", "description": "Tur Dal, Chana, Moong, Urad" } },
              { "@type": "Offer", "itemOffered": { "@type": "Product", "name": "Spices", "description": "Turmeric, Chilli, Coriander, Cumin" } },
              { "@type": "Offer", "itemOffered": { "@type": "Product", "name": "Oilseeds", "description": "Soybean, Groundnut, Mustard" } },
              { "@type": "Offer", "itemOffered": { "@type": "Product", "name": "Fresh Produce", "description": "Onion, Fruits, Vegetables" } }
            ]
          },
          "sameAs": []
        },
        {
          "@type": "WebSite",
          "name": "Panjara Agro",
          "url": "https://panjara-agro.vercel.app",
          "description": "Official website of Panjara Agro Farmers Producer Company Limited — Premium Indian agricultural commodity exports."
        }
      ]
    }
    </script>
  <script>
    window.onerror = function (msg, url, lineNo, columnNo, error) {
      document.getElementById('loading-status').innerHTML = '<div style="color:red; font-size:14px;">' +
        '<b>Error detected:</b> ' + msg + '<br/>' +
        '<small>Check console for details. Path: ' + (error ? error.stack : 'N/A') + '</small></div>';
      return false;
    };
    // Diagnostic check
    setTimeout(() => {
      const statusEl = document.getElementById('loading-status');
      if (statusEl && statusEl.innerText.includes('Loading')) {
        statusEl.innerHTML += '<div style="margin-top:10px; font-size:12px; color:#666;">' +
          'Initial bundle is taking longer than expected... Attempting to verify backend connection...</div>';
        fetch('http://127.0.0.1:3001/health').then(r => {
          statusEl.innerHTML += '<div style="color:green; font-size:12px;">✅ Backend reachable at 127.0.0.1:3001</div>';
        }).catch(e => {
          statusEl.innerHTML += '<div style="color:orange; font-size:12px;">⚠️ Backend unreachable. Ensure backend is running.</div>';
        });
      }
    }, 5000);
  </script>
</head>

<body>
  <div id="root">
    <div
      style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; color: #333; text-align: center; padding: 20px;">
      <div id="loading-status">Loading Panjara Agro...</div>
    </div>
  </div>

</body>

</html>
